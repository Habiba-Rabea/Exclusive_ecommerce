<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradient for Background -->
    <linearGradient id="exGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="50%" stop-color="#F7C59F" />
      <stop offset="100%" stop-color="#E63946" />
    </linearGradient>
    
    <linearGradient id="bagGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Container with Smooth Rounded Corners -->
  <rect width="512" height="512" rx="110" fill="url(#exGradient)" />

  <!-- Integrated E-Commerce Shopping Bag Concept within letter E & X -->
  <g filter="url(#dropShadow)">
    <!-- Shopping Bag Body -->
    <path d="M 140 180 C 140 165, 155 150, 170 150 L 342 150 C 357 150, 372 165, 372 180 L 392 400 C 392 420, 377 430, 355 430 L 157 430 C 135 430, 120 420, 120 400 Z" fill="url(#bagGradient)" />
    
    <!-- Bag Handles -->
    <path d="M 200 160 L 200 120 C 200 90, 220 70, 256 70 C 292 70, 312 90, 312 120 L 312 160" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" />
    <path d="M 200 160 L 200 120 C 200 90, 220 70, 256 70 C 292 70, 312 90, 312 120 L 312 160" fill="none" stroke="#FF6B35" stroke-width="16" stroke-linecap="round" />

    <!-- Stylized "E" inside Bag -->
    <path d="M 180 220 L 240 220 M 180 290 L 230 290 M 180 360 L 240 360" fill="none" stroke="#FF6B35" stroke-width="22" stroke-linecap="round" />
    <line x1="180" y1="220" x2="180" y2="360" stroke="#FF6B35" stroke-width="22" stroke-linecap="round" />

    <!-- Stylized "X" inside Bag -->
    <path d="M 280 220 L 340 360 M 340 220 L 280 360" fill="none" stroke="#E63946" stroke-width="22" stroke-linecap="round" />
  </g>
</svg>
